name: Tests

on:
  push:
    branches: [main, cr-036-init, cr-042-remote-mcp]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pytest pyyaml "mcp[cli]>=1.2.0"

      - name: Run qualification tests
        run: pytest tests/qualification/ -v
